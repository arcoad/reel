[package]
name = "reel-desktop"
version = "1.1.3"
edition = "2021"
description = "Reel music player"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rusqlite = { version = "0.43.0", features = ["bundled"] }
futures-util = "0.3.34"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["time"] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"

# Быстрая сборка: без LTO, инкрементально и без отладочных символов.
# link.exe заменяется на rust-lld в scripts/build-local.ps1.
[profile.release]
opt-level = 2
incremental = true
strip = "symbols"
